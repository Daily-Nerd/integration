name: HassCheck

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  hasscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Daily-Nerd/hasscheck@main
        with:
          emit-publish: 'true'
          publish-endpoint: 'https://hasscheck.io'
          ha-version: '2026.5.0'
          smoke: 'true'
          ha-version-matrix: '2026.5.0,2026.6.0b0'
          smoke-timeout: '180'
